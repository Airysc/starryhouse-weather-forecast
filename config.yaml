# StarryHouse Weather Forecast 設定檔
location:
  name: 清境觀星園
  latitude: 24.076361111
  longitude: 121.17122222
  elevation_m: 2087
  timezone: Asia/Taipei

# 網頁（GitHub Pages，由 Actions 每 10 分鐘重建並部署）
site:
  # 啟用 Pages 後填入實際網址；用來在啟動時讀上一次的 latest.json（直播 ID 快取）
  url: "https://airysc.github.io/starryhouse-weather-forecast/"
  # meteoblue 免費 widget 以 iframe 直接寫在 site/index.html（需保留連回 meteoblue 的連結）
  # 頁尾連結
  links:
    - label: 氣象署 清境農場 預報
      url: "https://www.cwa.gov.tw/V8/C/L/Farm/Farm.html?QS=&PID=E011"
    - label: 氣象署 觀星 專區
      url: "https://www.cwa.gov.tw/V8/C/L/StarView/StarView.html"
    - label: 氣象署 雷達回波
      url: "https://www.cwa.gov.tw/V8/C/W/OBS_Radar.html"
    - label: 氣象署 衛星雲圖
      url: "https://www.cwa.gov.tw/V8/C/W/OBS_Sat.html"

# 觀測窗口（當地時間），跨日
window:
  start_hour: 18
  end_hour: 9

# 判斷門檻（以氣象署 天氣現象 + 3 小時降雨機率 為主）
scoring:
  good_weather_keywords: [晴, 多雲時晴]      # 天氣現象包含這些字視為「適合」
  ok_weather_keywords: [多雲]                # 視為「勉強」
  bad_weather_keywords: [陰, 雨, 霧, 雷]     # 視為「不適合」
  good_pop_max: 20
  ok_pop_max: 30

cwa:
  # 育樂天氣預報 未來 3 天逐 3 小時（fileapi 檔案型資料集，tools/find_cwa_dataset.py 已確認）：
  #   F-B0053-017 農場   → 清境農場（約 1,750 m，距觀星園約 2 km）
  #   F-B0053-071 觀星   → 鳶峰停車場（約 2,750 m，距觀星園約 8 km）
  forecast_dataset: F-B0053-017
  forecast_location: 清境農場
  # 即時觀測：O-A0001-001 自動氣象站為每小時（最近為梅峰 1 km）；O-A0003-001 每 10 分鐘更新，
  # 附近有屯原（4 km、2047 m）、北東眼山（5.3 km）。tools/nearby_stations.py 可列出。
  obs_dataset: O-A0003-001
  # 留空 = 自動取該資料集裡距離最近的測站
  obs_station_name: 屯原

imagery:
  # 每張圖每 10 分鐘一幀；動畫涵蓋前幾小時。全部縮圖轉 WebP 存在 Pages，網頁 JS 輪播動畫幀
  hours_back: 3
  step_min: 10
  max_width: 800        # 最新一張
  quality: 80
  anim_frames: 10       # 動畫抽幀數（含最新一幀）
  anim_width: 640
  anim_quality: 70
  frame_ms: 300
  # 網址格式已用 tools/probe_images.py 驗證（2026-09-16）：雷達為 png、衛星為 jpg，時間戳皆為台灣時間
  products:
    radar:
      label: 雷達回波
      url: "https://www.cwa.gov.tw/Data/radar/CV1_3600_{ts_local_compact}.png"
      page: "https://www.cwa.gov.tw/V8/C/W/OBS_Radar.html"
    # 真實色全天可用：夜間氣象署以微光／紅外合成（低雲暗紅、高雲白）
    sat_vis:
      label: 衛星雲圖（真實色）
      url: "https://www.cwa.gov.tw/Data/satellite/TWI_TRGB_1350/TWI_TRGB_1350-{ts_local_dash}.jpg"
      page: "https://www.cwa.gov.tw/V8/C/W/OBS_Sat.html"
    # 紅外線色調強化（備用，目前不顯示）：
    #   https://www.cwa.gov.tw/Data/satellite/TWI_IR1_CR_800/TWI_IR1_CR_800-{ts_local_dash}.jpg

# keywords：直播標題必須「同時」包含所有關鍵字（頻道常同時開多個直播）
streams:
  - name: 鳶峰全天域星空直播（臺北天文館）
    handle: TaipeiAstroMuseum
    keywords: [鳶峰]
    fallback_page: "https://tw.live/cam/?id=yfxkzb"
  - name: 清境觀星園直播（親子觀星會）
    handle: familystar123
    keywords: [清境]
